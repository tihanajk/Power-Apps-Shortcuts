<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Power Apps shortcuts</title>
    <script src="info.js" defer=""></script>
    <!-- Link to the external script -->
    <link rel="stylesheet" href="info.css" />
  </head>
  <body>
    <header class="popup-header">
      <div class="title-row">
        <img class="logo" src="../img/icon.png" alt="" />
        <h2>Power Apps Shortcuts</h2>
      </div>
      <span class="version">v2.0.0.33</span>
    </header>

    <p class="hint">Assign keyboard shortcuts in <code>edge://extensions/shortcuts</code>, or trigger an action directly below.</p>
    <button id="open-shortcuts" class="primary-btn">Manage keyboard shortcuts</button>

    <label class="open-mode-toggle">
      <input type="checkbox" id="open-mode" />
      <span class="open-mode-switch"></span>
      <span class="open-mode-label">Show results in a modal on the current tab</span>
    </label>

    <div class="search-wrap">
      <input id="action-search" type="text" placeholder="Search actions…" autocomplete="off" />
    </div>

    <div id="action-buttons"></div>
    <div id="empty-state" class="empty-state hidden">No matching actions</div>

    <footer class="popup-footer">
      <a href="https://github.com/tihanajk/Power-Apps-Shortcuts/issues" target="_blank" rel="noopener">Report a bug or request a feature</a>
    </footer>
  </body>
</html>
