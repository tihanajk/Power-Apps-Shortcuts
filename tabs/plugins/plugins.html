<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plugins view</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="plugins.css" />
  </head>
  <body>
    <div id="header">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h1 id="assembly-name">Plugins view</h1>
        <button type="button" id="downloadBtn">Export to excel</button>
      </div>
      <input id="search" placeholder="Search" name="filter" type="text" />
    </div>

    <div id="toggle">
      <label class="toggle"
        ><input type="checkbox" id="expandCheck" name="expand" /><span class="toggle-switch"></span
        ><span class="toggle-label">Expand all</span></label
      >
    </div>
    <div class="legend">
      <span class="legend-title">Legend:</span>
      <span class="legend-item">⚡ Step</span>
      <span class="legend-item">🟢 Enabled</span>
      <span class="legend-item">🟡 Disabled</span>
      <span class="legend-item">🔀 Synchronous</span>
      <span class="legend-item">⏱️ Asynchronous</span>
      <span class="legend-item">🔍 Filters</span>
      <span class="legend-item">🖼️ Image</span>
    </div>
    <div id="tree"></div>

    <script src="../../xlsx.full.min.js"></script>
    <script src="../../excelHelper.js"></script>
    <script src="plugins.js"></script>
  </body>
</html>
