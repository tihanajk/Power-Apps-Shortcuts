<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FetchXml results</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="fetch.css" />
  </head>

  <body>
    <div id="header">
      <div style="display: flex; justify-content: space-between">
        <h1 id="title">Fetched data for entity</h1>
        <button type="button" id="downloadBtn">Export to excel</button>
      </div>
      <input id="search" placeholder="Search" name="filter" type="text" />
    </div>
    <div id="count-row" class="count-row" style="display: none">
      <span id="count" class="count"></span>
      <div id="pager" class="pager" style="display: none">
        <button type="button" id="prevPage">◀ Prev</button>
        <span class="pager-page">Page <input type="number" id="pageInput" min="1" value="1" /></span>
        <button type="button" id="nextPage">Next ▶</button>
      </div>
    </div>
    <div id="fetch-content">Results</div>
    <script src="../../xlsx.full.min.js"></script>
    <script src="../../excelHelper.js"></script>
    <script src="fetch.js"></script>
  </body>
</html>
